<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)" />
    <!-- 首次繪製前套主題與字級（邏輯同 src/lib/theme.ts 的 applyTheme／applyFontSize）；module script 是 defer，等它跑深色使用者會先閃一下米紙底、大字級使用者會看到版面跳一下 -->
    <script>
      (function () {
        var pref, size
        try { pref = localStorage.getItem('theme'); size = localStorage.getItem('fontSize') } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.fontSize = size === 'lg' || size === 'xl' ? size : 'md'
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', dark ? '#14110f' : '#f4efe4')
        })
      })()
    </script>
    <!-- 只有標題用 Noto Serif TC；Google Fonts 依 unicode-range 切片，只載畫面上用到的字。
         這支 CSS 本身就上百 KB，直接掛 stylesheet 會擋住首次繪製與 module script：先用 media="print"
         讓它非阻塞下載，載完再切成 all（標題先用後備字型，display=swap 本來就是這個行為）。
         由腳本建立而不寫 <link onload>：build 產物有 CSP（vite.config.ts），inline 事件屬性會被擋 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var font = document.createElement('link')
        font.rel = 'stylesheet'
        font.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap'
        font.media = 'print'
        font.onload = function () { font.media = 'all' }
        document.head.appendChild(font)
      })()
    </script>
    <meta name="description" content="一群人五分鐘內決定吃哪家：各自設條件，系統過濾加權，轉盤公平抽選。" />
    <!-- 邀請連結貼到 LINE 的預覽卡片；og:image 必須是絕對網址（換網域見 docs/deploy.md） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="今天吃什麼" />
    <meta property="og:description" content="一群人五分鐘內決定吃哪家：各自設條件，系統過濾加權，轉盤公平抽選。" />
    <meta property="og:image" content="https://ray910408.github.io/FairBite/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="今天吃什麼：一群人五分鐘決定吃哪家" />
    <title>今天吃什麼</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
