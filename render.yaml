# Render Blueprint：Go API。目前的正式服務是在 Dashboard 手動建的（New Web Service），
# 本檔是那份設定的版控備份，重建服務時 New → Blueprint 指向這個 repo 即可還原。
# sync: false 的變數不進版控，套用時由 Render 問你要填什麼。
services:
  - type: web
    name: fairbite
    runtime: go
    plan: free
    region: singapore
    rootDir: server
    buildCommand: go build -o app .
    startCommand: ./app
    healthCheckPath: /healthz
    # 不讓 Render 自己監看 main：部署由 deploy-pages.yml 的 deploy-api job 在 migrate 之後
    # 透過 Deploy Hook 觸發（DB → API → Web）。正式服務是 Dashboard 建的，這行只是備份，
    # 實際設定在 Settings → Auto-Deploy: Off
    autoDeployTrigger: "off" # 加引號：YAML 1.1 會把裸 off 解析成布林 false
    envVars:
      # 跟 server/go.mod 的 go 指令同步（1.25 已停止安全更新）；Render 原生 builder 的預設版本可能較舊
      - key: GO_VERSION
        value: 1.26.10
      # CORS 只吃單一來源，且不含路徑：GitHub Pages 的 origin 是 user site 根網域
      - key: WEB_ORIGIN
        value: https://ray910408.github.io
      # Supabase → Project Settings → Database → Connection pooling 的字串
      # （必須用 pooler，直連是 IPv6-only，Render free 連不到）
      - key: SUPABASE_DB_URL
        sync: false
      # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWKS_URL
        sync: false
      # 留空則走 14 家 mock 餐廳
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Supabase Before User Created hook 的 signing secret（v1,whsec_...）；漏了它而 hook 已啟用，
      # 所有註冊與訪客加入（匿名登入）都會被 503 擋下。建立 hook 的順序見 docs/deploy.md「註冊 Email」一節
      - key: SIGNUP_HOOK_SECRET
        sync: false
