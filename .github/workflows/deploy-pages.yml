name: Deploy web

# main 綠燈後依序部署 DB → API → Web：先把 pending migrations 推上 Supabase，再用 Deploy
# Hook 叫 Render 部署同一個 commit 並等它上線，最後才把 web/dist 推上 GitHub Pages。
# Render 的 Auto-Deploy 必須是 Off，否則它會自己監看 main、搶在 migrate 之前上線（docs/deploy.md）。
# 手動 workflow_dispatch 也只允許 main；非 main 不會推 production schema 或部署 API／Pages。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，且不取消進行中的（取消到一半會留下半套 Pages 狀態）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pin 同 ci.yml：供應鏈防護，也避免解析 latest 打 GitHub API 撞 rate limit
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.113.0
      # 先在 runner 的本機 stack 重放全部 migrations＋pgTAP，紅就不碰 production：
      # push 觸發的 CI 與本 workflow 平行跑，不能指望 CI 先紅（Codex P1）
      # pgTAP＋DB-backed Go 測試都綠才碰 production，與 ci.yml db job 同套驗證。
      - run: supabase start
      - run: supabase test db
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: supabase link --project-ref zltocdydngmdnutzarlq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # 0017（2026-08-14 線上壞一天）、09-30 餐廳時區、10-03 初選都是「新 Go 讀寫的欄位還不存在」：
  # Render 自己監看 main 時沒有任何東西讓它等 migrate，後兩次只能靠人工拆 PR 避開。
  # 改由這個 job 在 migrate 之後才觸發部署。
  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: https://fairbite.onrender.com
    steps:
      # 帶 ref 指定部署這個 commit。200＝已開始；202＝有別的部署在跑，這次已排進佇列、Render 會在它
      # 結束後接著部署（docs: deploy-hooks）——不要重送，每送一次就多排一個重複的部署
      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::缺 repo secret RENDER_DEPLOY_HOOK_URL（Render → Settings → Deploy Hook）"
            exit 1
          fi
          case "$HOOK_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          # repo 公開、Actions log 也公開：整串 URL 已被 secrets 遮罩，但失敗時會印 Render 的回應，
          # 回應若單獨帶到 key 就不會被遮——先把 key 本身也登記成遮罩
          key="${HOOK_URL##*key=}"
          echo "::add-mask::${key%%&*}"
          # 連線失敗時 curl 非零結束，在 Actions 的 bash -e 下會直接中止、印不出原因；改記成 000
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "${HOOK_URL}${sep}ref=${GITHUB_SHA}") || code=000
          case "$code" in
            200) cat response.json; echo ;;
            202) echo "Render 有別的部署在跑，這次已排隊，下一步會等到它上線" ;;
            *)
              echo "::error::Render deploy hook 回 HTTP $code"
              # 印出 Render 的錯誤說明（2026-10-11 首次上線回 500 時沒印，無從判斷原因）
              [ -s response.json ] && head -c 500 response.json
              echo
              exit 1 ;;
          esac
      # 舊版在新版就緒前會繼續服務，所以要等 /healthz 回報的 commit（Render 的 RENDER_GIT_COMMIT）
      # 真的變成這次的 SHA 才算上線；只比對有值的回報，空值或舊 commit 一律繼續等
      - name: Wait for Render to serve this commit
        run: |
          for attempt in $(seq 1 60); do
            commit=$(curl -sS --max-time 60 "$API_URL/healthz" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ ${#commit} -ge 7 ] && [ "${GITHUB_SHA#"$commit"}" != "$GITHUB_SHA" ]; then
              echo "Render 已上線 $commit"
              exit 0
            fi
            echo "線上 commit：${commit:-（未回報）}，20 秒後再查（$attempt/60）"
            sleep 20
          done
          echo "::error::Render 沒有在時限內上線 $GITHUB_SHA"
          exit 1

  deploy:
    needs: deploy-api # 間接也等 migrate：前端最後上，新畫面不會打到還沒部署的 API
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc -b + vite build，讀 web/.env.production
        working-directory: web
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
