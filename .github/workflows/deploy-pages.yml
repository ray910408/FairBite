name: Deploy web

# main 綠燈後把 web/dist 推上 GitHub Pages。後端在 Render，由 Render 自己監看 main。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，且不取消進行中的（取消到一半會留下半套 Pages 狀態）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build # tsc -b + vite build，讀 web/.env.production
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
